experiment_name: ResNet50_ImageNet
data_dir: /workspace/data/imagenet
work_dir: /workspace/runs
epochs: 90
save_checkpoint_interval: 10
num_classes: 1000
batch_size: 128
gradient_accumulation_steps: 1
learning_rate: 0.1
weight_decay: 0.0001
momentum: 0.9
step_lr_decay: 0.1
lr_step_size: 30
lr_warmup_epochs: 5
lr_warmup_start_factor: 0.1
bias_weight_decay: false
norm_weight_decay: false
max_grad_norm: 1.0
img_size: 224
resize_size: 256
num_workers: 24
model_name: resnet50
pretrained: false
log_with: wandb
seed: 42
mixed_precision: bf16
